plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    runs {
        data {
            data()

            programArgs "--mod", "infinitybuttons"
            programArgs "--all"
            programArgs "--output", project(":common").file("src/main/generated").getAbsolutePath()
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modImplementation files('libs/diopside-neoforge-1.0.0.jar')
    modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"

    // Bundled with YACL in production
    forgeRuntimeLibrary "org.quiltmc.parsers:json:${rootProject.gson_version}"
    forgeRuntimeLibrary "org.quiltmc.parsers:gson:${rootProject.gson_version}"

    modImplementation "maven.modrinth:jei:iiCpE7cU"
    modImplementation "maven.modrinth:emi:1.1.24+1.21.1+neoforge"
    modImplementation "maven.modrinth:jade:15.10.5+neoforge"

    modLocalRuntime "maven.modrinth:atmospheric:XIvPRE4O" // 7.0.1
    modLocalRuntime "maven.modrinth:blueprint:5JOCYuQM" // 8.1.0
    modLocalRuntime "maven.modrinth:woodworks:aJd8UVN0" // 4.0.2

    // Team Abnormals mods that are loaded unconditionally for some reason
    modLocalRuntime "maven.modrinth:gallery:HzOpAks9" // 2.0.1

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    Properties props = new Properties()
    rootProject.file("gradle.properties").withInputStream {
        props.load(it)
    }
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand rootProject.properties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
